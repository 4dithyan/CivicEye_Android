<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CivicEye Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar injected by js -->
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="header">
                <div>
                    <h1 style="font-weight:700;">Dashboard Overview</h1>
                    <p style="color:var(--secondary);">Welcome back, Admin</p>
                </div>
                <div class="user-profile">
                    <span id="adminEmail">admin@civic.com</span>
                    <div class="user-avatar">A</div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card" style="border-color: #6366f1;">
                    <div class="stat-label">Total Issues</div>
                    <div class="stat-value" id="totalIssues">...</div>
                    <small class="text-secondary">Reported all time</small>
                </div>
                <div class="stat-card" style="border-color: #10b981;">
                    <div class="stat-label">Resolved Issues</div>
                    <div class="stat-value" id="resolvedIssues">...</div>
                    <small style="color:#10b981;">Recently completed</small>
                </div>
                <div class="stat-card" style="border-color: #f59e0b;">
                    <div class="stat-label">Active Pending</div>
                    <div class="stat-value" id="pendingIssues">...</div>
                    <small style="color:#f59e0b;">Requires attention</small>
                </div>
                <div class="stat-card" style="border-color: #3b82f6;">
                    <div class="stat-label">Registered Citizens</div>
                    <div class="stat-value" id="totalUsers">...</div>
                    <small>Active community</small>
                </div>
            </div>

            <!-- Charts Row -->
            <div style="display:grid; grid-template-columns: 2fr 1fr; gap:24px; margin-bottom: 24px;">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Issue Status Distribution</div>
                    </div>
                    <canvas id="statusChart" height="200"></canvas>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Top Departments</div>
                    </div>
                    <canvas id="deptChart" height="200"></canvas>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="js/admin.js"></script>

    <script>


        let statusChart, deptChart;

        function renderCharts(pending, inProgress, resolved, issues) {
            // Destroy existing charts if they exist
            if (statusChart) statusChart.destroy();
            if (deptChart) deptChart.destroy();

            // Status Chart
            statusChart = new Chart(document.getElementById('statusChart'), {
                type: 'bar',
                data: {
                    labels: ['Pending', 'In Progress', 'Resolved', 'Rejected'],
                    datasets: [{
                        label: 'Issues',
                        data: [pending, inProgress, resolved, issues.filter(i => i.status === 'rejected').length],
                        backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#ef4444'],
                        borderRadius: 8
                    }]
                },
                options: { customCanvasBackgroundColor: '#ffffff' }
            });

            // Dept Chart
            const deptCounts = {};
            issues.forEach(i => {
                const d = i.category || 'Other';
                deptCounts[d] = (deptCounts[d] || 0) + 1;
            });

            deptChart = new Chart(document.getElementById('deptChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(deptCounts),
                    datasets: [{
                        data: Object.values(deptCounts),
                        backgroundColor: ['#6366f1', '#ec4899', '#8b5cf6', '#14b8a6']
                    }]
                }
            });
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                console.log("Auth verified, loading stats...");
                loadDashboardStats();
            }
        });

        async function loadDashboardStats() {
            // Real-time Issues
            db.collection('issues').onSnapshot(issuesSnap => {
                const issues = issuesSnap.docs.map(doc => doc.data());

                const total = issues.length;
                const resolved = issues.filter(i => i.status === 'resolved' || i.status === 'verified').length;
                const pending = issues.filter(i => i.status === 'pending').length;
                const inProgress = issues.filter(i => i.status === 'in_progress').length;

                document.getElementById('totalIssues').textContent = total;
                document.getElementById('resolvedIssues').textContent = resolved;
                document.getElementById('pendingIssues').textContent = pending;

                renderCharts(pending, inProgress, resolved, issues);
            }, error => {
                console.error("Issues sync failed:", error);
            });

            // Real-time Citizens Count
            db.collection('users').where('role', '==', 'civilian').onSnapshot(usersSnap => {
                document.getElementById('totalUsers').textContent = usersSnap.size;
            }, error => {
                console.error("Users sync failed:", error);
            });
        }
    </script>
</body>

</html>
